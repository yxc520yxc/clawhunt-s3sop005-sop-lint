name: Verify #2506 Stage iii SOP 引擎与工作台
# 纯 Python 任务：无外部服务依赖。两个 job 并行：
#   verify —— pytest 四条验收（逐用例名输出），上传日志 artifact
#   lint   —— sop-lint 自检（合法样例退出 0 / 错误样例退出非 0），上传报告 artifact
on:
  push:
  workflow_dispatch:

jobs:
  verify:
    name: 验收测试 (pytest, 逐用例名)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: 生成虚构夹具与错误样例集
        run: python _gen_fixtures.py
      - name: 运行四条验收测试并计时（逐用例名输出）
        run: |
          mkdir -p evidence
          START=$(date +%s)
          python -m pytest -v -s tests/ 2>&1 | tee evidence/pytest.log
          RC=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "PYTEST_SECONDS=$((END-START))" | tee -a evidence/timings.txt
          echo "PYTEST_EXIT=$RC" | tee -a evidence/timings.txt
          exit $RC
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verify-evidence, path: evidence/ }

  lint:
    name: sop-lint 自检 (退出码 + 类别覆盖)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: 生成虚构夹具与错误样例集
        run: python _gen_fixtures.py
      - name: 合法样例应全部通过 (exit 0)
        run: |
          mkdir -p evidence
          python sop_lint.py examples/ 2>&1 | tee evidence/lint-valid.log
          test ${PIPESTATUS[0]} -eq 0
      - name: 错误样例应退出非 0 并覆盖 7 类
        run: |
          set +e
          python sop_lint.py --json errors/ > evidence/lint-errors.json 2>&1
          RC=$?
          set -e
          echo "LINT_ERRORS_EXIT=$RC"
          test $RC -ne 0
          python -c "import json; d=json.load(open('evidence/lint-errors.json',encoding='utf-8')); codes={i['code'] for f in d['files'] for i in f['issues'] if i['severity']=='error'}; need={'E001','E002','E003','E004','E005','E006','E007'}; print('detected:', sorted(codes)); assert need.issubset(codes), need-codes"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint-evidence, path: evidence/ }
